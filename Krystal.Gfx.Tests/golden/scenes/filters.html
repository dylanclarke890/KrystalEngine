<!doctype html>
<!-- The "filters" golden scene; Krystal.Gfx.Tests/tests/Render2D/Golden.cpp draws the same. -->
<html data-width="320" data-height="240">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #e9ecf2; overflow: hidden; }
  div { position: absolute; box-sizing: border-box; }
  .tile { width: 80px; height: 80px; }
  .square { left: 14px; top: 14px; width: 36px; height: 36px; background: #e04848; }
  .circle { left: 30px; top: 30px; width: 36px; height: 36px; border-radius: 50%; background: #3c64dc; }
</style>
</head>
<body>
  <div class="tile" style="left: 0; top: 0; filter: grayscale(1)"><div class="square"></div><div class="circle"></div></div>
  <div class="tile" style="left: 80px; top: 0; filter: sepia(1)"><div class="square"></div><div class="circle"></div></div>
  <div class="tile" style="left: 160px; top: 0; filter: saturate(3)"><div class="square"></div><div class="circle"></div></div>
  <div class="tile" style="left: 240px; top: 0; filter: hue-rotate(90deg)"><div class="square"></div><div class="circle"></div></div>
  <div class="tile" style="left: 0; top: 80px; filter: invert(1)"><div class="square"></div><div class="circle"></div></div>
  <div class="tile" style="left: 80px; top: 80px; filter: brightness(1.5)"><div class="square"></div><div class="circle"></div></div>
  <div class="tile" style="left: 160px; top: 80px; filter: contrast(2)"><div class="square"></div><div class="circle"></div></div>
  <div class="tile" style="left: 240px; top: 80px; filter: opacity(0.5)"><div class="square"></div><div class="circle"></div></div>
  <div class="tile" style="left: 0; top: 160px; filter: blur(4px)"><div class="square"></div><div class="circle"></div></div>
  <div class="tile" style="left: 80px; top: 160px; filter: drop-shadow(4px 4px 3px rgba(0, 0, 0, 0.6))"><div class="square"></div><div class="circle"></div></div>
  <div class="tile" style="left: 160px; top: 160px; filter: invert(0.6)"><div class="square"></div><div class="circle"></div></div>
  <div class="tile" style="left: 240px; top: 160px; filter: grayscale(1) blur(2px)"><div class="square"></div><div class="circle"></div></div>
</body>
</html>
