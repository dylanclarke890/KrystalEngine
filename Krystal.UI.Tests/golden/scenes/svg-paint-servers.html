<!doctype html>
<!-- The "svg-paint-servers" page golden; Krystal.UI.Tests/tests/Golden.cpp paints it through Page. -->
<html data-width="360" data-height="240">
<head>
<meta charset="utf-8">
<style>
  html { background: #ffffff; overflow: hidden; }
  body { margin: 0; }
  svg { position: absolute; }
</style>
</head>
<body>
  <!-- Linear gradients: in bounding box units, vertical, with stop opacity, spread by reflecting and repeating
       (in user space units), and one taking its stops from another through href. -->
  <svg style="left: 8px; top: 8px" width="168" height="104">
    <defs>
      <linearGradient id="sunset">
        <stop offset="0" stop-color="#ef476f" />
        <stop offset="0.5" stop-color="#ffd166" />
        <stop offset="1" stop-color="#06d6a0" />
      </linearGradient>
      <linearGradient id="fade" x2="0" y2="1">
        <stop offset="0" stop-color="#118ab2" />
        <stop offset="1" stop-color="#118ab2" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="reflect" gradientUnits="userSpaceOnUse" x1="8" x2="28" spreadMethod="reflect">
        <stop offset="0" stop-color="#073b4c" />
        <stop offset="1" stop-color="#ffd166" />
      </linearGradient>
      <linearGradient id="repeat" href="#reflect" spreadMethod="repeat" gradientTransform="rotate(45 88 76)" />
    </defs>
    <rect x="8" y="8" width="72" height="40" fill="url(#sunset)" />
    <rect x="88" y="8" width="72" height="40" fill="url(#fade)" stroke="url(#sunset)" stroke-width="4" />
    <rect x="8" y="56" width="72" height="40" fill="url(#reflect)" />
    <rect x="88" y="56" width="72" height="40" fill="url(#repeat)" />
  </svg>

  <!-- Radial gradients: centred, with a focal point, a focal radius and repeating; one on a stroke. -->
  <svg style="left: 184px; top: 8px" width="168" height="104">
    <defs>
      <radialGradient id="glow">
        <stop offset="0" stop-color="#ffd166" />
        <stop offset="1" stop-color="#ef476f" />
      </radialGradient>
      <radialGradient id="focal" fx="0.25" fy="0.25" fr="0.1">
        <stop offset="0" stop-color="#ffffff" />
        <stop offset="1" stop-color="#118ab2" />
      </radialGradient>
      <radialGradient id="rings" r="0.2" spreadMethod="repeat">
        <stop offset="0" stop-color="#06d6a0" />
        <stop offset="1" stop-color="#073b4c" />
      </radialGradient>
    </defs>
    <circle cx="32" cy="32" r="24" fill="url(#glow)" />
    <circle cx="88" cy="32" r="24" fill="url(#focal)" />
    <rect x="120" y="8" width="40" height="48" fill="url(#rings)" />
    <ellipse cx="84" cy="80" rx="72" ry="14" fill="none" stroke="url(#glow)" stroke-width="8" />
  </svg>

  <!-- Patterns: a checkerboard in user space units, a pattern in bounding box units with a view box, one
       transformed (without rotating: Chrome draws a pattern's content at its final transform, where the tile
       is drawn into an image first here, so a rotated tile's edges differ), and one on a stroke. -->
  <svg style="left: 8px; top: 120px" width="344" height="112">
    <defs>
      <pattern id="checks" width="16" height="16" patternUnits="userSpaceOnUse">
        <rect width="16" height="16" fill="#ffd166" />
        <rect width="8" height="8" fill="#073b4c" />
        <rect x="8" y="8" width="8" height="8" fill="#073b4c" />
      </pattern>
      <pattern id="dots" width="0.25" height="0.5" viewBox="0 0 10 10">
        <circle cx="5" cy="5" r="4" fill="#ef476f" />
      </pattern>
      <pattern id="stripes" href="#checks" patternTransform="translate(4 2) scale(1.5 0.75)" />
      <pattern id="dashes" width="12" height="12" patternUnits="userSpaceOnUse">
        <rect width="6" height="12" fill="#118ab2" />
      </pattern>
    </defs>
    <rect x="8" y="8" width="72" height="72" fill="url(#checks)" />
    <rect x="96" y="8" width="96" height="72" fill="url(#dots)" stroke="#073b4c" />
    <rect x="208" y="8" width="72" height="72" fill="url(#stripes)" />
    <rect x="300" y="12" width="32" height="88" rx="8" fill="none" stroke="url(#dashes)" stroke-width="8" />
    <circle cx="44" cy="96" r="10" fill="url(#missing) #06d6a0" />
  </svg>
</body>
</html>
