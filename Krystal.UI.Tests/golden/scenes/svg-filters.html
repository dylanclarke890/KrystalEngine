<!doctype html>
<!-- The "svg-filters" page golden; Krystal.UI.Tests/tests/Golden.cpp paints it through Page. -->
<html data-width="360" data-height="240">
<head>
<meta charset="utf-8">
<style>
  html { background: #ffffff; overflow: hidden; }
  body { margin: 0; }
  svg, div { position: absolute; }
</style>
</head>
<body>
  <!-- Colour: a drop shadow built from primitives (a blurred, offset, flooded alpha merged under the source),
       a saturation, a hue rotation and a component transfer (a posterising table and a linear alpha). -->
  <svg style="left: 8px; top: 8px" width="168" height="104">
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" />
        <feOffset in="blur" dx="4" dy="4" result="moved" />
        <feFlood flood-color="#073b4c" flood-opacity="0.6" />
        <feComposite in2="moved" operator="in" result="tinted" />
        <feMerge><feMergeNode in="tinted" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
      <filter id="saturate"><feColorMatrix type="saturate" values="0.2" /></filter>
      <filter id="hue"><feColorMatrix type="hueRotate" values="120" /></filter>
      <filter id="posterise">
        <feComponentTransfer>
          <feFuncR type="discrete" tableValues="0 0.5 1" />
          <feFuncG type="table" tableValues="1 0" />
          <feFuncA type="linear" slope="0.7" />
        </feComponentTransfer>
      </filter>
      <linearGradient id="rainbow">
        <stop offset="0" stop-color="#ef476f" /><stop offset="0.5" stop-color="#ffd166" /><stop offset="1" stop-color="#06d6a0" />
      </linearGradient>
    </defs>
    <rect x="8" y="8" width="64" height="36" rx="6" fill="#ef476f" filter="url(#shadow)" />
    <rect x="92" y="8" width="68" height="40" fill="url(#rainbow)" filter="url(#saturate)" />
    <rect x="8" y="56" width="72" height="40" fill="url(#rainbow)" filter="url(#hue)" />
    <rect x="88" y="56" width="72" height="40" fill="url(#rainbow)" filter="url(#posterise)" />
  </svg>

  <!-- Shapes: dilation and erosion, an arithmetic composite of a flood, a multiply blend of an offset copy,
       and tiling. -->
  <svg style="left: 184px; top: 8px" width="168" height="104">
    <defs>
      <filter id="dilate"><feMorphology operator="dilate" radius="3 1" /></filter>
      <filter id="erode"><feMorphology operator="erode" radius="2" /></filter>
      <filter id="arithmetic">
        <feFlood flood-color="#118ab2" result="flood" />
        <feComposite in="SourceGraphic" in2="flood" operator="arithmetic" k1="0" k2="0.6" k3="0.4" k4="0" />
      </filter>
      <filter id="multiply">
        <feOffset dx="10" dy="6" result="copy" />
        <feBlend in="SourceGraphic" in2="copy" mode="multiply" />
      </filter>
      <filter id="tile" filterUnits="userSpaceOnUse" x="88" y="56" width="72" height="40">
        <feFlood flood-color="#ffd166" x="88" y="56" width="12" height="10" result="cell" />
        <feOffset in="SourceGraphic" dx="0" dy="0" x="88" y="56" width="12" height="10" result="corner" />
        <feMerge x="88" y="56" width="12" height="10" result="merged"><feMergeNode in="cell" /><feMergeNode in="corner" /></feMerge>
        <feTile in="merged" />
      </filter>
    </defs>
    <path d="M12 12 L36 12 L36 40 Z" fill="#073b4c" filter="url(#dilate)" />
    <rect x="48" y="12" width="28" height="28" fill="#ef476f" filter="url(#erode)" />
    <circle cx="124" cy="28" r="18" fill="#ef476f" filter="url(#arithmetic)" />
    <rect x="8" y="56" width="48" height="28" fill="#06d6a0" fill-opacity="0.8" filter="url(#multiply)" />
    <circle cx="94" cy="61" r="4" fill="#ef476f" filter="url(#tile)" />
  </svg>

  <!-- Light and noise: diffuse lighting from a distant light, specular lighting from a point light, an
       edge-detecting convolution and turbulence. -->
  <svg style="left: 8px; top: 120px" width="168" height="112">
    <defs>
      <filter id="diffuse">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="bump" />
        <feDiffuseLighting in="bump" surfaceScale="4" diffuseConstant="1" lighting-color="#ffd166">
          <feDistantLight azimuth="225" elevation="45" />
        </feDiffuseLighting>
        <feComposite in2="SourceAlpha" operator="in" />
      </filter>
      <filter id="specular">
        <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="bump" />
        <feSpecularLighting in="bump" surfaceScale="5" specularConstant="1" specularExponent="12" lighting-color="white" result="light">
          <fePointLight x="100" y="10" z="40" />
        </feSpecularLighting>
        <feComposite in="light" in2="SourceAlpha" operator="in" result="shine" />
        <feComposite in="SourceGraphic" in2="shine" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
      </filter>
      <filter id="edges">
        <feConvolveMatrix order="3" kernelMatrix="-1 -1 -1 -1 8 -1 -1 -1 -1" preserveAlpha="true" />
      </filter>
      <filter id="noise" x="0" y="0" width="1" height="1">
        <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="3" />
        <feColorMatrix type="matrix" values="0 0 0 0 0.07  0 0 0 0 0.54  0 0 0 0 0.70  0 0 0 1.2 0" />
      </filter>
    </defs>
    <rect x="12" y="12" width="60" height="36" rx="10" fill="#118ab2" filter="url(#diffuse)" />
    <circle cx="120" cy="30" r="22" fill="#ef476f" filter="url(#specular)" />
    <g filter="url(#edges)"><rect x="12" y="64" width="60" height="36" fill="#ffffff" /><circle cx="42" cy="82" r="12" fill="#118ab2" /></g>
    <rect x="92" y="64" width="64" height="36" filter="url(#noise)" />
  </svg>

  <!-- feImage of an element, feDropShadow in bounding box units, and an HTML box filtered by a url(). -->
  <svg style="left: 184px; top: 120px" width="168" height="112">
    <defs>
      <circle id="dot" cx="20" cy="20" r="12" fill="#06d6a0" />
      <filter id="image" x="0" y="0" width="1" height="1">
        <feImage href="#dot" result="dot" />
        <feComposite in="SourceGraphic" in2="dot" operator="xor" />
      </filter>
      <filter id="drop" primitiveUnits="objectBoundingBox" x="-20%" y="-20%" width="160%" height="160%">
        <feDropShadow dx="0.1" dy="0.15" stdDeviation="0.04" flood-color="#073b4c" flood-opacity="0.7" />
      </filter>
      <filter id="html-filter">
        <feGaussianBlur stdDeviation="1.5" />
        <feColorMatrix type="hueRotate" values="200" />
      </filter>
    </defs>
    <rect x="8" y="8" width="40" height="40" fill="#073b4c" filter="url(#image)" />
    <rect x="72" y="12" width="60" height="32" rx="4" fill="#ffd166" filter="url(#drop)" />
  </svg>
  <div style="left: 200px; top: 180px; width: 120px; height: 40px; background: #ef476f; border-radius: 8px; filter: url(#html-filter)"></div>
</body>
</html>
