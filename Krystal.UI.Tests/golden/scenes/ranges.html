<!doctype html>
<!-- The "ranges" page golden; Krystal.UI.Tests/tests/Golden.cpp paints it through View. -->
<html data-width="360" data-height="280">
<head>
<meta charset="utf-8">
<style>
  html { background: #ffffff; overflow: hidden; }
  body { margin: 12px; }
  div { height: 28px; margin-bottom: 8px; }
  input, progress, meter { vertical-align: middle; margin: 0 12px 0 0; }
  input { width: 96px; }
  progress, meter { width: 80px; }
  .dark { color-scheme: dark; background: #1e1e1e; padding: 4px; }
</style>
</head>
<body>
  <!-- Ranges: the thumb at the value along the track, filled in the accent colour up to it; a disabled one;
       one in the page's accent colour. -->
  <div>
    <input type="range" value="25"><input type="range" value="80" disabled><input type="range" value="60" style="accent-color: #ef476f">
  </div>
  <!-- A vertical range. -->
  <div style="height: 132px">
    <input type="range" value="70" style="appearance: slider-vertical; width: 20px">
    <!-- Progress bars: determinate, at a quarter and three quarters, and one without its appearance, drawn by
         its shadow tree. -->
    <progress value="0.25"></progress><progress value="0.75"></progress>
    <progress value="0.5" style="appearance: none"></progress>
  </div>
  <!-- Meters in each region, drawn by their shadow trees (Adwaita doesn't draw meters). -->
  <div>
    <meter value="0.8"></meter>
    <meter min="0" max="100" low="20" high="80" optimum="90" value="50"></meter>
    <meter min="0" max="100" low="20" high="80" optimum="90" value="10"></meter>
  </div>
  <div class="dark">
    <input type="range" value="40"><progress value="0.6"></progress>
  </div>
</body>
</html>
