<!doctype html>
<!-- The "svg" page golden; Krystal.UI.Tests/tests/Golden.cpp paints it through Page. -->
<html data-width="360" data-height="240">
<head>
<meta charset="utf-8">
<style>
  html { background: #ffffff; overflow: hidden; }
  body { margin: 0; }
  svg { position: absolute; }
</style>
</head>
<body>
  <!-- Shapes: a rect, a rounded rect, a circle, an ellipse, with fills and strokes. -->
  <svg style="left: 8px; top: 8px" width="168" height="72">
    <rect x="6" y="6" width="36" height="36" fill="#ef476f" />
    <rect x="50" y="6" width="36" height="36" rx="8" fill="#ffd166" stroke="#073b4c" stroke-width="3" />
    <circle cx="112" cy="24" r="18" fill="#06d6a0" stroke="#118ab2" stroke-width="4" />
    <ellipse cx="148" cy="24" rx="14" ry="20" fill="none" stroke="#ef476f" stroke-width="2" />
    <rect x="6" y="50" width="160" height="16" fill="#118ab2" fill-opacity="0.5" stroke="#073b4c" stroke-opacity="0.5" stroke-width="2" />
  </svg>

  <!-- Lines with caps, a polyline with joins, and dashes. -->
  <svg style="left: 184px; top: 8px" width="168" height="72">
    <g stroke="#073b4c" stroke-width="8">
      <line x1="12" y1="12" x2="60" y2="12" stroke-linecap="butt" />
      <line x1="12" y1="30" x2="60" y2="30" stroke-linecap="round" />
      <line x1="12" y1="48" x2="60" y2="48" stroke-linecap="square" />
    </g>
    <polyline points="76,60 92,16 108,60" fill="none" stroke="#ef476f" stroke-width="8" stroke-linejoin="miter" />
    <polyline points="116,60 132,16 148,60" fill="none" stroke="#06d6a0" stroke-width="8" stroke-linejoin="round" />
    <line x1="12" y1="66" x2="160" y2="66" stroke="#118ab2" stroke-width="3" stroke-dasharray="10 4 2 4" />
  </svg>

  <!-- Paths: curves and arcs, fill rules, and zero length subpaths drawn as dots by round caps. -->
  <svg style="left: 8px; top: 88px" width="168" height="72">
    <path d="M 6 60 C 20 0, 40 0, 54 60 Q 60 70 66 60" fill="none" stroke="#073b4c" stroke-width="3" />
    <path d="M 80 8 L 104 64 L 72 28 L 112 28 L 80 64 Z" fill="#ffd166" fill-rule="nonzero" />
    <path d="M 124 8 L 148 64 L 116 28 L 156 28 L 124 64 Z" fill="#ffd166" fill-rule="evenodd" stroke="#ef476f" />
    <path d="M 60 12 A 10 10 0 1 1 60 13 M 30 66 z M 40 66 z" fill="none" stroke="#118ab2" stroke-width="5" stroke-linecap="round" />
  </svg>

  <!-- Groups with transforms and opacity, a view box, nested <svg>s and paint order. -->
  <svg style="left: 184px; top: 88px" width="168" height="72" viewBox="0 0 84 36">
    <g transform="translate(4 4) rotate(10)" opacity="0.6">
      <rect width="20" height="20" fill="#ef476f" />
      <rect x="10" y="10" width="20" height="20" fill="#118ab2" />
    </g>
    <svg x="40" y="2" width="20" height="32" viewBox="0 0 10 10" preserveAspectRatio="xMidYMid meet">
      <circle cx="5" cy="5" r="5" fill="#06d6a0" />
    </svg>
    <circle cx="72" cy="18" r="8" fill="#ffd166" stroke="#073b4c" stroke-width="4" paint-order="stroke" />
  </svg>

  <!-- A link around a shape, and non-scaling strokes. -->
  <svg style="left: 8px; top: 168px" width="344" height="64">
    <a href="#"><rect x="6" y="6" width="52" height="52" fill="#073b4c" /></a>
    <g transform="scale(3 1)">
      <rect x="24" y="8" width="20" height="48" fill="none" stroke="#ef476f" stroke-width="2" />
      <rect x="52" y="8" width="20" height="48" fill="none" stroke="#118ab2" stroke-width="2" vector-effect="non-scaling-stroke" />
    </g>
    <polygon points="250,8 290,56 210,56" fill="#06d6a0" stroke="#073b4c" stroke-width="4" stroke-linejoin="bevel" />
    <rect x="300" y="8" width="36" height="48" fill="#ffd166" visibility="hidden" />
  </svg>
</body>
</html>
