<!doctype html>
<!-- The "backdrop" page golden; Krystal.UI.Tests/tests/Golden.cpp paints it through Page. -->
<html data-width="360" data-height="240">
<head>
<meta charset="utf-8">
<style>
  html { background: #ffffff; overflow: hidden; }
  body { margin: 0; }
  div, img { position: absolute; box-sizing: border-box; }
  .stripes { background: repeating-linear-gradient(45deg, #073b4c 0 6px, #ffd166 6px 12px, #ef476f 12px 18px); }
  .glass { width: 64px; height: 64px; }
</style>
</head>
<body>
  <!-- What the backdrops show: stripes, a gradient band and an image. -->
  <div class="stripes" style="left: 0; top: 0; width: 360px; height: 112px"></div>
  <div style="left: 0; top: 112px; width: 360px; height: 128px; background: linear-gradient(90deg, #06d6a0, #118ab2 50%, #8338ec)"></div>
  <img src="images/photo.jpg" style="left: 200px; top: 128px; width: 144px; height: 96px">

  <!-- A blur, a grayscale over the image, and a darkened, rounded glass with a translucent fill. -->
  <div class="glass" style="left: 16px; top: 24px; backdrop-filter: blur(4px)"></div>
  <div class="glass" style="left: 232px; top: 144px; backdrop-filter: grayscale(1)"></div>
  <div class="glass" style="left: 96px; top: 24px; border-radius: 16px; background: rgba(255, 255, 255, 0.3);
                            backdrop-filter: brightness(0.6) contrast(1.4)"></div>

  <!-- A bordered glass: the backdrop fills the border box. -->
  <div class="glass" style="left: 176px; top: 24px; border: 6px solid rgba(7, 59, 76, 0.6); backdrop-filter: invert(1)"></div>

  <!-- A translucent ancestor is the backdrop root: the glass shows only what's inside it, not the stripes. -->
  <div style="left: 256px; top: 16px; width: 88px; height: 80px; opacity: 0.8">
    <div style="left: 8px; top: 8px; width: 40px; height: 64px; background: #ef476f"></div>
    <div class="glass" style="left: 24px; top: 8px; backdrop-filter: blur(3px) hue-rotate(90deg)"></div>
  </div>

  <!-- A box painted after a glass, over it, stays out of the glass's backdrop. -->
  <div class="glass" style="left: 24px; top: 136px; backdrop-filter: blur(6px)"></div>
  <div style="left: 64px; top: 160px; width: 48px; height: 48px; background: #ffd166; z-index: 1"></div>
</body>
</html>
