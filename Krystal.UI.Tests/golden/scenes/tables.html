<!doctype html>
<!-- The "tables" page golden; Krystal.UI.Tests/tests/Golden.cpp paints it through Page. -->
<html data-width="360" data-height="240">
<head>
<meta charset="utf-8">
<style>
  html { background: #f4f6fa; overflow: hidden; }
  body { margin: 0; }
  table { position: absolute; }
  td { width: 24px; height: 16px; padding: 0; }
  .separate { left: 16px; top: 16px; border: 3px solid #073b4c; border-spacing: 6px; background: #dfe7f0; }
  .separate td { border: 2px solid #118ab2; background: #ffd166; }
  .collapse { left: 140px; top: 16px; border-collapse: collapse; border: 4px solid #ef476f; }
  .collapse td { border: 2px solid #073b4c; }
  .collapse td.wide { border: 6px double #06d6a0; }
  .collapse td.dash { border: 3px dashed #8338ec; }
  .layers { left: 16px; top: 120px; border-spacing: 0; }
  .spans { left: 140px; top: 120px; border-collapse: collapse; }
  .spans td { border: 2px solid #073b4c; }
  .spans tbody { border: 4px solid #118ab2; }
</style>
</head>
<body>
  <table class="separate">
    <tr><td></td><td></td><td></td></tr>
    <tr><td></td><td style="background: #ef476f"></td><td></td></tr>
  </table>

  <table class="collapse">
    <tr><td></td><td class="wide"></td><td></td><td></td></tr>
    <tr><td class="dash"></td><td></td><td></td><td class="wide"></td></tr>
    <tr><td></td><td></td><td class="dash"></td><td></td></tr>
  </table>

  <table class="layers">
    <colgroup style="background: #ef476f"><col style="background: #ffd166"><col></colgroup>
    <col style="background: #06d6a0">
    <tbody style="background: #118ab2">
      <tr style="background: #8338ec"><td></td><td></td><td style="background: #ffffff"></td></tr>
      <tr><td></td><td></td><td></td></tr>
      <tr style="background: rgba(255, 255, 255, 0.5)"><td></td><td></td><td></td></tr>
    </tbody>
  </table>

  <table class="spans">
    <tbody>
      <tr><td rowspan="2" style="background: #ef476f"></td><td colspan="2" style="background: #ffd166"></td></tr>
      <tr><td></td><td style="background: #06d6a0"></td></tr>
      <tr><td colspan="3" style="background: #8338ec"></td></tr>
    </tbody>
  </table>
</body>
</html>
