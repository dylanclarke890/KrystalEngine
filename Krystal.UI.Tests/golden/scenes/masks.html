<!doctype html>
<!-- The "masks" page golden; Krystal.UI.Tests/tests/Golden.cpp paints it through Page. -->
<html data-width="360" data-height="240">
<head>
<meta charset="utf-8">
<style>
  html { background: #ffffff; overflow: hidden; }
  body { margin: 0; }
  div { position: absolute; box-sizing: border-box; }
  .tile { width: 56px; height: 56px; background: linear-gradient(135deg, #ef476f, #ffd166 50%, #118ab2); }
  .tile > div { left: 12px; top: 12px; width: 32px; height: 32px; border-radius: 8px; background: #06d6a0; }
  .two { mask-image: radial-gradient(circle at 35% 50%, black 40%, transparent 41%),
                     linear-gradient(90deg, transparent 50%, black 50%); }
</style>
</head>
<body>
  <!-- Alpha masks: a fade, a circle, an image, and luminance. -->
  <div class="tile" style="left: 16px; top: 16px; mask-image: linear-gradient(black, transparent)"><div></div></div>
  <div class="tile" style="left: 88px; top: 16px; mask-image: radial-gradient(circle, black 60%, transparent 61%)"><div></div></div>
  <div class="tile" style="left: 160px; top: 16px; mask-image: url(images/disc.webp); mask-size: contain; mask-repeat: no-repeat; mask-position: center"><div></div></div>
  <div class="tile" style="left: 232px; top: 16px; mask-image: linear-gradient(90deg, white, black); mask-mode: luminance"><div></div></div>

  <!-- Sizes, positions and repeats: dots, and a quarter in the middle. -->
  <div class="tile" style="left: 304px; top: 16px; mask-image: radial-gradient(circle, black 45%, transparent 50%); mask-size: 14px 14px"><div></div></div>
  <div class="tile" style="left: 16px; top: 88px; mask-image: linear-gradient(black, black); mask-size: 50% 50%; mask-repeat: no-repeat; mask-position: center"><div></div></div>

  <!-- mask-clip: the content box of a padded tile. -->
  <div class="tile" style="left: 88px; top: 88px; padding: 10px; mask-image: linear-gradient(black, black); mask-clip: content-box"><div></div></div>

  <!-- The four composites of a circle over a half. -->
  <div class="tile two" style="left: 160px; top: 88px; mask-composite: add"><div></div></div>
  <div class="tile two" style="left: 232px; top: 88px; mask-composite: subtract"><div></div></div>
  <div class="tile two" style="left: 304px; top: 88px; mask-composite: intersect"><div></div></div>
  <div class="tile two" style="left: 16px; top: 160px; mask-composite: exclude"><div></div></div>

  <!-- A masked box with a child that overflows it, and a masked inline box. -->
  <div style="left: 88px; top: 160px; width: 56px; height: 56px; background: #073b4c; mask-image: linear-gradient(90deg, black 60%, transparent)">
    <div style="left: 30px; top: 30px; width: 40px; height: 40px; background: #ffd166"></div>
  </div>
  <div style="left: 160px; top: 168px; width: 180px; line-height: 40px">
    <span style="padding: 8px 60px; background: #ef476f; mask-image: linear-gradient(90deg, transparent, black)">&nbsp;</span>
  </div>
</body>
</html>
