<!doctype html>
<!-- The "block-in-inline" page golden: an inline box broken around its block children. It's open where it's broken,
     so its borders, background and outline go around the pieces, not each. Glyphs are boxes from the Ahem font. -->
<html data-width="480" data-height="420">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Ahem; src: url("fonts/Ahem.woff"); }
  html { background: #ffffff; overflow: hidden; }
  body { margin: 8px; font: 12px/16px Ahem; color: #223388; }
  .cell { float: left; width: 140px; height: 90px; margin: 0 12px 12px 0; }
  .b { height: 12px; background: #33aa66; }
  .box { border: 3px solid #cc3355; padding: 0 4px; margin: 0 5px; background: #ffdd88; }
  .outline { outline: 2px solid #cc3355; }
  .auto { outline: 2px auto #cc3355; }
  .relative { position: relative; left: 8px; top: 4px; background: #ffdd88; }
  .abs { position: absolute; right: 0; bottom: 0; width: 6px; height: 6px; background: #000000; }
  .margin { margin: 6px 0; }
  .rtl { direction: rtl; }
  .radius { border-radius: 6px; }
  .underline { text-decoration: underline; color: #888888; }
  .blockbg { background: #33aa66; }
</style>
</head>
<body>
  <div class="cell">aa<span class="box">bb<div class="b"></div>cc</span>dd</div>
  <div class="cell"><span class="box"><div class="b"></div>cc</span></div>
  <div class="cell"><span class="box">bb<div class="b"></div></span></div>
  <div class="cell">aa<span class="box">bb<em class="box" style="border-color:#3355cc">xx<div class="b"></div>yy</em>cc</span>dd</div>
  <div class="cell">aa<span class="outline">bb<div class="b"></div>cc</span>dd</div>
  <div class="cell">aa<span class="auto">bb<div class="b"></div>cc</span>dd</div>
  <div class="cell">aa<span class="relative">bb<div class="b"></div>cc</span>dd</div>
  <div class="cell">aa<span class="relative">bb<div class="b"></div>cc<i class="abs"></i></span>dd</div>
  <div class="cell">aa<span class="box">bb<div class="b margin"></div>cc</span>dd</div>
  <div class="cell rtl">aa<span class="box">bb<div class="b"></div>cc</span>dd</div>
  <div class="cell">aa<span class="box radius">bb<div class="b"></div>cc</span>dd</div>
  <div class="cell">aa<span class="underline">bb<div class="b">ee</div>cc</span>dd</div>
</body>
</html>
