<!doctype html>
<!-- The "date-picker" page golden; Krystal.UI.Tests/tests/Golden.cpp paints it through View, in US English, with
     the date input's picker open. Chrome draws its pickers in a window of their own, so there's no Chrome
     golden. -->
<html data-width="280" data-height="260">
<head>
<meta charset="utf-8">
<style>
  html { background: #ffffff; overflow: hidden; }
  body { margin: 12px; font: 13px sans-serif; }
</style>
</head>
<body>
  <input type="date" id="date" value="2026-03-07" min="2026-03-03">
  <p>Text under the picker.</p>
</body>
</html>
