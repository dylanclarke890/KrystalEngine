<!doctype html>
<!-- The "color-picker" page golden; Krystal.UI.Tests/tests/Golden.cpp paints it through View, with the colour
     input's picker open. Chrome draws its pickers in a window of their own, so there's no Chrome golden. -->
<html data-width="240" data-height="200">
<head>
<meta charset="utf-8">
<style>
  html { background: #ffffff; overflow: hidden; }
  body { margin: 12px; font: 13px sans-serif; }
</style>
</head>
<body>
  <input type="color" id="color" value="#ff0000">
  <p>Text under the picker.</p>
</body>
</html>
