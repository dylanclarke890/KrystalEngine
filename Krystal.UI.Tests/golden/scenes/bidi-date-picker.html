<!doctype html>
<!-- The "bidi-date-picker" page golden; Krystal.UI.Tests/tests/Golden.cpp paints it through View, in US English,
     with the right-to-left date input's picker open: mirrored, lined up with the input's right edge, the week
     running from the right and the previous month's button on the right. Chrome draws its pickers in a window of
     their own, so there's no Chrome golden. -->
<html dir="rtl" data-width="280" data-height="260">
<head>
<meta charset="utf-8">
<style>
  html { background: #ffffff; overflow: hidden; }
  body { margin: 12px; font: 13px "Liberation Sans", sans-serif; }
</style>
</head>
<body>
  <input type="date" id="date" value="2026-03-07" min="2026-03-03">
  <p>טקסט מתחת לבורר.</p>
</body>
</html>
