<!doctype html>
<!-- The "font-rules" page golden: @font-palette-values and @font-feature-values, and @font-face's features. The
     colour glyph is two boxes in a palette's colours 0 and 1, and the features widen a box (see
     Krystal.Booey.Tests/tools/make_feature_test_fonts.py). -->
<html data-width="320" data-height="160">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Palette; src: url("fonts/PaletteTest.ttf"); }
  @font-face { font-family: Feature; src: url("fonts/FeatureTest.ttf"); }
  @font-face { font-family: FeatureFace; src: url("fonts/FeatureTest.ttf"); font-feature-settings: "ss01"; }
  @font-palette-values --one { font-family: Palette; base-palette: 1; }
  @font-palette-values --over { font-family: Palette; override-colors: 1 #000000; }
  @font-palette-values --lightOver { font-family: Palette; base-palette: light; override-colors: 0 #ff00ff; }
  @font-palette-values --range { font-family: Palette; base-palette: 9; }
  @font-palette-values --clear { font-family: Palette; override-colors: 1 transparent; }
  @font-feature-values Feature { @styleset { wide: 2; } @stylistic { wider: 1; } }
  html { background: #ffffff; overflow: hidden; }
  body { margin: 8px; }
  div { height: 40px; margin-bottom: 8px; }
  .palettes span { display: inline-block; vertical-align: top; margin-right: 4px; font: 32px/32px Palette; }
  .features { font: 10px/28px Feature; color: #223388; }
  .features span { display: inline-block; vertical-align: top; margin-right: 4px; }
</style>
</head>
<body>
<div class="palettes"><span>a</span><span style="font-palette: light">a</span><span style="font-palette: dark">a</span><span style="font-palette: --one">a</span><span style="font-palette: --over">a</span><span style="font-palette: --lightOver">a</span><span style="font-palette: --range">a</span><span style="font-palette: --clear">a</span></div>
<div class="features"><span>a</span><span style="font-family: FeatureFace">a</span><span style="font-family: FeatureFace; font-feature-settings: 'ss01' 0">a</span><span style="font-variant-alternates: styleset(wide)">a</span><span style="font-variant-alternates: stylistic(wider)">a</span><span style="font-feature-settings: 'cv01'">a</span></div>
</body>
</html>
