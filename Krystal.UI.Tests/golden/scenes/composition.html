<!doctype html>
<!-- The "composition" page golden; Krystal.UI.Tests/tests/Golden.cpp paints this page through Page after
     composing text at the end of #field with an input method, with clause underlines: thin, thick for the
     clause being converted, and one in its own colour. A page can't compose text, so Chrome renders the page as
     it is. -->
<html data-width="360" data-height="120">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Liberation Sans"; src: url("../../../third-party/liberation-fonts/LiberationSans-Regular.ttf"); font-weight: normal; font-style: normal; }
  html { background: #ffffff; overflow: hidden; }
  body { margin: 12px; font: 20px/28px "Liberation Sans"; color: #1a2240; }
  div { width: 320px; padding: 4px 8px; border: 1px solid #c0c6d4; border-radius: 6px; caret-color: transparent; }
  div:focus { outline: none; }
</style>
</head>
<body>
  <div id="field" contenteditable>Typed then&nbsp;</div>
</body>
</html>
