     running from the right. Chrome draws its pickers in a window of their own, so there's no Chrome golden. -->

<head>

<style>
  html { background: #ffffff; overflow: hidden; }
  body { margin: 12px; font: 13px "Liberation Sans", sans-serif; }
</style>
</head>
<body>
  <input type="color" id="color" value="#ff0000">
  <p>טקסט מתחת לבורר.</p>
</body>
</html>
