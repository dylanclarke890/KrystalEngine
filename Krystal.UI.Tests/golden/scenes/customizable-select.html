<!doctype html>
<!-- The "customizable-select" page golden; Krystal.UI.Tests/tests/Golden.cpp opens the first select's
     picker. Selects with `appearance: base-select`: a plain one, and one with its own button. -->
<html data-width="320" data-height="240">
<head>
<meta charset="utf-8">
<style>
  html { background: #ffffff; overflow: hidden; }
  body { margin: 12px; font: 13px sans-serif; }
  select, ::picker(select) { appearance: base-select; }
  select { display: flex; width: 140px; margin-bottom: 12px; }
  #custom { background: #eef2ff; border-color: #3355cc; color: #223388; }
  #custom::picker-icon { color: #cc3355; }
  #custom button { font-weight: bold; }
</style>
</head>
<body>
  <select id="plain">
    <option>Apple</option>
    <option selected>Banana</option>
    <option disabled>Cherry</option>
    <option label="Date palm">Date</option>
  </select>
  <select id="custom">
    <button><selectedcontent></selectedcontent></button>
    <option>Elderberry</option>
    <option>Fig</option>
  </select>
</body>
</html>
