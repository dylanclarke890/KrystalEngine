<!doctype html>
<!-- The "img" page golden; Krystal.UI.Tests/tests/Golden.cpp paints it through Page, its images loaded from
     images/ by relative file URLs. -->
<html data-width="360" data-height="240">
<head>
<meta charset="utf-8">
<style>
  html { background: #e9ecf2; overflow: hidden; }
  body { margin: 0; }
  img, picture img { position: absolute; }
  .fit { width: 64px; height: 56px; top: 96px; background: #ffffff; }
</style>
</head>
<body>
  <!-- A JPEG at its natural size and scaled by its attributes, translucent WebP over a colour, and a GIF with
       padding and a border. -->
  <img src="images/photo.jpg" style="left: 16px; top: 16px">
  <img src="images/photo.jpg" width="96" height="64" style="left: 80px; top: 16px">
  <img src="images/disc.webp" style="left: 192px; top: 16px; width: 64px; height: 64px; background: #118ab2">
  <img src="images/diamond.gif" style="left: 272px; top: 16px; padding: 8px; border: 4px solid #073b4c; background: #ffd166">

  <!-- object-fit and object-position. -->
  <img class="fit" src="images/landscape.png" style="left: 16px">
  <img class="fit" src="images/landscape.png" style="left: 96px; object-fit: contain">
  <img class="fit" src="images/landscape.png" style="left: 176px; object-fit: cover">
  <img class="fit" src="images/landscape.png" style="left: 256px; object-fit: none; object-position: right 4px bottom 4px">

  <!-- A width descriptor at half size, a picture's source by type, a rounded border, and a width giving the
       height through the image's ratio. -->
  <img srcset="images/hires.png 96w" sizes="48px" style="left: 16px; top: 176px">
  <picture>
    <source srcset="images/missing.unsupported" type="image/x-unsupported">
    <source srcset="images/landscape.png" media="(max-width: 100px)">
    <source srcset="images/hires.png 2x" type="image/png">
    <img src="images/lores.png" style="left: 80px; top: 176px">
  </picture>
  <img src="images/photo.jpg" style="left: 144px; top: 176px; border: 3px solid #ef476f; border-radius: 16px">
  <img src="images/landscape.png" width="96" style="left: 224px; top: 176px">
</body>
</html>
