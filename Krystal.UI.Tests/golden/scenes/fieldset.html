<!doctype html>
<!-- The "fieldset" page golden: a legend sits in its fieldset's border, which and whose background leave room for it. -->
<html data-width="480" data-height="360">
<head>
<meta charset="utf-8">
<style>
  html { background: #ffffff; overflow: hidden; }
  body { margin: 8px; }
  fieldset {
    float: left; box-sizing: content-box; width: 120px; height: 40px; margin: 0 8px 12px 0; padding: 4px;
    border: 4px solid #223388; background: #dde4ff; min-inline-size: auto;
  }
  legend { width: 40px; height: 16px; padding: 0; background: #cc3355; }
  .content { height: 12px; background: #33aa66; }
  .thin { border-width: 1px; }
  .thick { border-width: 16px; }
  .short { height: 6px; }
  .tall { height: 36px; }
  .center { text-align: center; }
  .right { text-align: right; }
  .rtl { direction: rtl; }
  .round { border-radius: 12px; }
  .margined { margin-left: 12px; margin-bottom: 6px; }
  .dashed { border-style: dashed; }
  .vertical { writing-mode: vertical-rl; width: 56px; height: 90px; }
  .vertical-lr { writing-mode: vertical-lr; width: 56px; height: 90px; }
  .vertical .content, .vertical-lr .content { width: 12px; height: auto; }
  .scroller { overflow: hidden; }
  .scroller .content { height: 200px; }
  .relative { position: relative; left: 6px; top: 3px; }
  .item { display: list-item; list-style-position: inside; }
</style>
</head>
<body>
  <fieldset><legend></legend><div class="content"></div></fieldset>
  <fieldset class="thin"><legend></legend><div class="content"></div></fieldset>
  <fieldset class="thick"><legend class="short"></legend><div class="content"></div></fieldset>
  <fieldset><legend class="tall"></legend><div class="content"></div></fieldset>
  <fieldset><legend class="center"></legend><div class="content"></div></fieldset>
  <fieldset><legend class="right"></legend><div class="content"></div></fieldset>
  <fieldset class="rtl"><legend></legend><div class="content"></div></fieldset>
  <fieldset class="round"><legend class="margined"></legend><div class="content"></div></fieldset>
  <fieldset class="dashed"><legend></legend><div class="content"></div></fieldset>
  <fieldset class="vertical"><legend></legend><div class="content"></div></fieldset>
  <fieldset class="vertical-lr"><legend></legend><div class="content"></div></fieldset>
  <fieldset class="scroller"><legend></legend><div class="content"></div></fieldset>
  <fieldset><legend class="relative"></legend><div class="content"></div></fieldset>
  <fieldset class="scroller"><legend class="relative"></legend><div class="content"></div></fieldset>
  <fieldset class="item"><legend></legend><div class="content"></div></fieldset>
</body>
</html>
