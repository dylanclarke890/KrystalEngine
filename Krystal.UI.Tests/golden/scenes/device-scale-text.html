<!doctype html>
<!-- The "device-scale-text" page golden; Krystal.UI.Tests/tests/Golden.cpp paints it through a View at a device
     scale factor of 2. -->
<html data-width="180" data-height="100" data-device-scale="2">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Liberation Sans"; src: url("../../../third-party/liberation-fonts/LiberationSans-Regular.ttf"); font-weight: normal; font-style: normal; }
  html { background: #ffffff; overflow: hidden; }
  body { margin: 8px; font: 12px/16px "Liberation Sans"; color: #222222; }
  p { margin: 0 0 6px; }
  .big { font-size: 20px; line-height: 24px; color: #4f6df5; }
  .layer { will-change: transform; background: #ffd166; padding: 0 4px; display: inline-block; }
</style>
</head>
<body>
  <p class="big">Crisp text</p>
  <p>Small text at twice the pixels, with <u>underlines</u>.</p>
  <p><span class="layer">On a composited layer</span></p>
</body>
</html>
