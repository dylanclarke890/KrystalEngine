<!doctype html>
<!-- The editor's page view; edit and press F5 to reload. Text isn't painted yet, so the page is made of
     backgrounds, borders, shadows, outlines and layers. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html { background: #eef1f6; }
  body { margin: 24px; }

  .row { display: flex; gap: 20px; margin-bottom: 20px; }
  .card { flex: 1; height: 180px; border-radius: 16px; background: #ffffff; padding: 20px; box-sizing: border-box;
          box-shadow: 0 2px 6px rgba(26, 34, 64, 0.1), 0 12px 32px rgba(26, 34, 64, 0.12); }

  .boxes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; height: 100%; }
  .boxes div { background: #f7f8fb; }

  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; height: 100%; }
  .swatches div { border-radius: 10px; }

  .gradient { border-radius: 12px; height: 100%; }

  .stage { position: relative; height: 100%; overflow: hidden; border-radius: 12px; background: #e9ecf2; }
  .stage div { position: absolute; width: 64px; height: 64px; border-radius: 12px; }
</style>
</head>
<body>
  <div class="row">
    <!-- Colours on a grid. -->
    <div class="card">
      <div class="swatches">
        <div style="background: #ef476f"></div>
        <div style="background: #ffd166"></div>
        <div style="background: #06d6a0"></div>
        <div style="background: #118ab2"></div>
        <div style="background: #073b4c"></div>
        <div style="background: rgba(239, 71, 111, 0.5)"></div>
        <div style="background: rgba(17, 138, 178, 0.5)"></div>
        <div style="background: #8338ec; border-radius: 50%"></div>
      </div>
    </div>

    <!-- Linear, radial and conic gradients. -->
    <div class="card">
      <div class="gradient" style="background: linear-gradient(120deg, #4f6df5, #b04ff5 60%, #ef476f)"></div>
    </div>
    <div class="card">
      <div class="gradient" style="background: radial-gradient(circle at 35% 35%, #ffffff, #ffd166 30%, #ef476f 70%, #073b4c)"></div>
    </div>
    <div class="card">
      <div class="gradient" style="border-radius: 50%; background: conic-gradient(#ef476f, #ffd166, #06d6a0, #118ab2, #8338ec, #ef476f)"></div>
    </div>
  </div>

  <div class="row">
    <!-- Tiled backgrounds. -->
    <div class="card">
      <div class="gradient" style="background: linear-gradient(45deg, #118ab2 25%, transparent 25%, transparent 75%, #118ab2 75%) 0 0 / 24px 24px, linear-gradient(45deg, #118ab2 25%, transparent 25%, transparent 75%, #118ab2 75%) 12px 12px / 24px 24px, #e9f5fb"></div>
    </div>

    <!-- Opacity, transforms and stacking. -->
    <div class="card">
      <div class="stage">
        <div style="left: 24px; top: 24px; background: #073b4c"></div>
        <div style="left: 56px; top: 48px; background: #ef476f; opacity: 0.7"></div>
        <div style="left: 150px; top: 30px; background: #ffd166; transform: rotate(25deg)"></div>
        <div style="left: 210px; top: 60px; background: #06d6a0; transform: scale(0.75) rotate(-15deg); z-index: 1"></div>
        <div style="left: 240px; top: 30px; background: #118ab2; z-index: -1"></div>
      </div>
    </div>

    <!-- Clips: clip-path shapes and a rounded overflow clip. -->
    <div class="card">
      <div class="stage">
        <div style="left: 20px; top: 34px; background: linear-gradient(#ef476f, #8338ec); clip-path: circle(32px)"></div>
        <div style="left: 100px; top: 34px; background: #ffd166; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)"></div>
        <div style="left: 180px; top: 34px; overflow: hidden; border-radius: 32px; background: #06d6a0">
          <div style="position: static; width: 96px; height: 32px; background: #073b4c"></div>
        </div>
      </div>
    </div>

    <!-- Blend modes over a gradient. -->
    <div class="card">
      <div class="stage" style="background: linear-gradient(90deg, #ffd166, #118ab2)">
        <div style="left: 24px; top: 40px; background: #ef476f; mix-blend-mode: multiply"></div>
        <div style="left: 104px; top: 40px; background: #ef476f; mix-blend-mode: screen"></div>
        <div style="left: 184px; top: 40px; background: #ef476f; mix-blend-mode: difference"></div>
      </div>
    </div>
  </div>

  <div class="row">
    <!-- Border styles. -->
    <div class="card">
      <div class="boxes">
        <div style="border: 3px solid #073b4c"></div>
        <div style="border: 3px dashed #ef476f"></div>
        <div style="border: 4px dotted #118ab2"></div>
        <div style="border: 6px double #073b4c"></div>
        <div style="border: 6px groove #9aa5b1"></div>
        <div style="border: 6px ridge #9aa5b1"></div>
        <div style="border: 6px inset #9aa5b1"></div>
        <div style="border: 6px outset #9aa5b1"></div>
      </div>
    </div>

    <!-- Rounded and multi-coloured borders. -->
    <div class="card">
      <div class="boxes" style="grid-template-columns: repeat(2, 1fr)">
        <div style="border: 4px solid #ef476f; border-radius: 14px"></div>
        <div style="border: 6px solid; border-color: #ef476f #ffd166 #06d6a0 #118ab2; border-radius: 50%"></div>
        <div style="border: 3px dashed #8338ec; border-radius: 14px"></div>
        <div style="border: 8px solid rgba(17, 138, 178, 0.4); border-radius: 30px / 14px"></div>
      </div>
    </div>

    <!-- A border image and shadows. -->
    <div class="card">
      <div class="boxes" style="grid-template-columns: repeat(2, 1fr); gap: 20px">
        <div style="border: 10px solid; border-image: repeating-linear-gradient(45deg, #ef476f 0 6px, #ffd166 6px 12px) 33% round"></div>
        <div style="border-radius: 12px; background: #ffffff; box-shadow: 0 8px 16px rgba(7, 59, 76, 0.35)"></div>
        <div style="border-radius: 12px; box-shadow: inset 0 4px 10px rgba(7, 59, 76, 0.5)"></div>
        <div style="border-radius: 12px; background: #ffffff; box-shadow: 0 0 0 4px #ffd166, 0 0 0 8px #ef476f"></div>
      </div>
    </div>

    <!-- Outlines, including a focus ring (outline-style: auto). -->
    <div class="card">
      <div class="boxes" style="grid-template-columns: repeat(2, 1fr); gap: 24px; padding: 6px">
        <div style="outline: 3px solid #118ab2; outline-offset: 3px"></div>
        <div style="border-radius: 10px; outline: 3px dashed #ef476f"></div>
        <div style="outline: 6px double #073b4c"></div>
        <div style="outline: 3px auto #8338ec"></div>
      </div>
    </div>
  </div>
</body>
</html>
